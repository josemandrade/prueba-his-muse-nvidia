name: SchoolVisionScreening
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026
releaseLabel: CI Build
description: >
  FHIR Implementation Guide for School Vision Screening interoperability.
  Defines profiles, operations, and examples for the exchange of vision screening
  results, referrals to ophthalmology, and assessment feedback between school
  health services, ophthalmology clinics, and primary care teams.
  
  This guide implements the workflow described in the School Vision Screening
  use case: school nurse screens visual acuity → refers to ophthalmology if
  abnormal → receives assessment summary → generates teacher accommodation
  notice → sends results to primary care for health record.
  
  Key interoperability points:
  - IP-1: Screening result capture (Observation panel)
  - IP-2: Referral dispatch and tracking (360X ServiceRequest + Task)
  - IP-3: Assessment return (DiagnosticReport + Observations + CarePlan)
  - IP-4: Primary care receives screening/assessment documents (MHD)
  - IP-5: Teacher accommodation notice (Communication)

