<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#374151" stroke-width="1.6"/></marker><marker id="arrow-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#6b7280" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1280" height="690" fill="#ffffff"/>
<text x="40" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#111827">Contrareferencia — devolver el resultado a APS (PI-3)</text>
<text x="40" y="52" font-family="sans-serif" font-size="13" fill="#6b7280">BPMN Parte B: Especialista escribe contrareferencia (diagnóstico, plan, seguimiento) &gt; Hub la enruta a APS &gt; APS acusa recibo &gt; Task counter-referred (ciclo cerrado)</text>
<line x1="190" y1="140" x2="190" y2="438" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="490" y1="140" x2="490" y2="438" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="790" y1="140" x2="790" y2="438" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="1090" y1="140" x2="1090" y2="438" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="484" y="178" width="12" height="232" fill="#ffffff" stroke="#374151" stroke-width="1.2"/>
<line x1="190" y1="186" x2="484" y2="186" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="230" y="144" width="215" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="337" y="157" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">OP-6 Enviar contrareferencia</text>
<rect x="248" y="163" width="179" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="337" y="176" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">POST /Bundle (document)</text>
<line x1="484" y1="258" x2="790" y2="258" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="522" y="216" width="229" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="637" y="229" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">OP-6 Reenviar contrareferencia</text>
<rect x="508" y="235" width="258" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="637" y="248" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">MHD ITI-65 Provide Document Bundle</text>
<line x1="790" y1="330" x2="1090" y2="330" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="785" y="288" width="309" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="940" y="301" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">OP-12 Entregar contrareferencia al médico</text>
<rect x="814" y="307" width="251" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="940" y="320" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">POST /Communication (APS interno)</text>
<line x1="790" y1="402" x2="496" y2="402" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="564" y="360" width="157" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="643" y="373" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">OP-6 Acuse de recibo</text>
<rect x="503" y="379" width="280" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="643" y="392" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">POST /Communication (basedOn -&gt; Task)</text>
<rect x="55" y="84" width="270" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="190" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">Especialista</text>
<rect x="355" y="84" width="270" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="490" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">Hub de derivación</text>
<rect x="655" y="84" width="270" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="790" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">Administrativo APS</text>
<rect x="955" y="84" width="270" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="1090" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">Médico APS</text>
<rect x="40" y="454" width="1200" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="476" font-family="sans-serif" font-size="12.5" fill="#451a03">Plazo de contrareferencia: 5 días hábiles desde el Encounter finished. Si vence, el hub escala a la especialidad y notifica a APS. Una contrareferencia que llega</text>
<text x="54" y="494" font-family="sans-serif" font-size="12.5" fill="#451a03">tarde se acepta igualmente: el plazo dispara escalada, no rechazo.</text>
<rect x="40" y="518" width="1200" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="540" font-family="sans-serif" font-size="12.5" fill="#451a03">El Task pasa a completed / businessStatus = counter-referred cuando el hub registra el acuse de recibo de APS (misma transacción). El ciclo queda cerrado; una</text>
<text x="54" y="558" font-family="sans-serif" font-size="12.5" fill="#451a03">corrección es una versión nueva del documento, no un cambio de estado.</text>
<rect x="40" y="582" width="1200" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="604" font-family="sans-serif" font-size="12.5" fill="#451a03">Asociación ofrecida: APS puede suscribirse a que el documento esté disponible (DSUBm ITI-110); la suscripción y la notificación tienen la misma forma que OP-11 con</text>
<text x="54" y="622" font-family="sans-serif" font-size="12.5" fill="#451a03">criteria sobre DocumentReference. La pierna de documento es MHD ITI-65 (full si se implementa exacto); 360X PCC-57 es solo el patrón de contenido.</text>
<text x="640" y="672" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Cada mensaje nombra la operación que lo lleva; el detalle (entradas, ejemplo, resultado esperado) está en la tabla de operaciones de sequences.md.</text>
</svg>