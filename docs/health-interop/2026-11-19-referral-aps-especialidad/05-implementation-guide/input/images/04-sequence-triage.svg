<rect x="54" y="146" width="329" height="22" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="62" y="161" font-family="sans-serif" font-size="12" font-weight="bold" fill="#111827">alt [aceptar — nombra servicio y profesional]</text>
<line x1="190" y1="216" x2="484" y2="216" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240" y="174" width="193" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="337" y="187" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">OP-2 Registrar aceptación</text>
<rect x="230" y="193" width="215" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="337" y="206" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">PATCH /Task accepted + owner</text>
<line x1="190" y1="288" x2="484" y2="288" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="251" y="246" width="172" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="337" y="259" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">OP-2 Registrar rechazo</text>
<rect x="204" y="265" width="266" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="337" y="278" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">PATCH /Task rejected + statusReason</text>
<line x1="484" y1="380" x2="790" y2="380" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="526" y="338" width="222" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="637" y="351" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">OP-12 Reenviar decisión a APS</text>
<rect x="515" y="357" width="244" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="637" y="370" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">POST /Communication (hub -&gt; APS)</text>
<line x1="790" y1="452" x2="1090" y2="452" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="840" y="410" width="200" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="940" y="423" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">OP-12 Avisar a la paciente</text>
<rect x="804" y="429" width="273" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="940" y="442" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">aviso no-FHIR: teléfono / presencial</text>
<rect x="55" y="84" width="270" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="190" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">Clínico de triaje</text>
<text x="190" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">especialidad</text>
<rect x="355" y="84" width="270" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="490" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">Hub de derivación</text>
<rect x="655" y="84" width="270" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="790" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">Administrativo APS</text>
<rect x="955" y="84" width="270" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="1090" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">Paciente</text>
<rect x="40" y="504" width="1200" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="526" font-family="sans-serif" font-size="12.5" fill="#451a03">Plazo de aceptación: 5 días hábiles desde la creación (2 si es urgente). Si vence, el hub escala a la especialidad y notifica a APS; el ciclo vuelve a entrar en la</text>
<text x="54" y="544" font-family="sans-serif" font-size="12.5" fill="#451a03">espera — un timeout nunca cierra la derivación.</text>
<rect x="40" y="568" width="1200" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="590" font-family="sans-serif" font-size="12.5" fill="#451a03">Si la especialidad rechaza, APS re-triaje en 5 días hábiles: re-derivar con más información o a otra especialidad es una derivación NUEVA (nuevo Task +</text>
<text x="54" y="608" font-family="sans-serif" font-size="12.5" fill="#451a03">ServiceRequest; ver diagrama de solicitud); la primera se cierra como rejected solo cuando APS decide el resultado del re-triaje.</text>
<rect x="40" y="632" width="1200" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="654" font-family="sans-serif" font-size="12.5" fill="#451a03">360X no tiene transacción de aceptar (la aceptación es implícita); en esta guía la aceptación es una transición explícita del Task (OP-2). PCC-56 Referral Decline es</text>
<text x="54" y="672" font-family="sans-serif" font-size="12.5" fill="#451a03">solo el patrón de la rama de rechazo.</text>
<text x="640" y="722" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Cada mensaje nombra la operación que lo lleva; el detalle (entradas, ejemplo, resultado esperado) está en la tabla de operaciones de sequences.md.</text>
</svg>