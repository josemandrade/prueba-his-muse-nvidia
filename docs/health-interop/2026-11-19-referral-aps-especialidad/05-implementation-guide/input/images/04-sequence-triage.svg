<rect x="0" y="0" width="1280" height="740" fill="#ffffff"/>
<text x="40" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#111827">Triaje — aceptar o rechazar la derivación (PI-1)</text>
<text x="40" y="52" font-family="sans-serif" font-size="13" fill="#6b7280">BPMN Parte A: Especialidad recibe &gt; Triaje &gt; ¿Aceptar o rechazar? &gt; Hub reenvía la decisión a APS &gt; APS informa a la paciente</text>
<rect x="54" y="146" width="572" height="178" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<line x1="54" y1="252" x2="626" y2="252" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="61" y="233" width="179" height="18" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="0.7"/><text x="150" y="246" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#111827">[rechazar — con motivo]</text>
