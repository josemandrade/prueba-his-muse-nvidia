<rect x="40" y="988" width="2100" height="38" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="1010" font-family="sans-serif" font-size="12.5" fill="#451a03">Sin identidad resuelta no se crea la derivación: el médico APS corrige los datos y reintenta (OP-9). Si el paciente rechaza la derivación en la creación, no se crea nada y APS registra la decisión y el motivo localmente (entidad 12, sin equivalente FHIR).</text>
<rect x="40" y="1034" width="2100" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="1056" font-family="sans-serif" font-size="12.5" fill="#451a03">El identificador de la derivación (REF-2026-0001) es la clave de continuación: enlaza este diagrama con los de triaje, agendamiento, atención, contrareferencia, consulta de estado y cancelación. Una respuesta que llega en otra sesión o día es su propio diagrama, nunca un retorno en el diagrama</text>
<text x="54" y="1074" font-family="sans-serif" font-size="12.5" fill="#451a03">que envía.</text>
<rect x="40" y="1098" width="2100" height="38" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="1120" font-family="sans-serif" font-size="12.5" fill="#451a03">OP-11 es opcional: APS se suscribe a las transiciones del Task; el hub notifica en cada transición (una Subscription FHIR sobre un evento que no es de documento es propia de la guía — DSUBm suscribe solo eventos de documento).</text>
<text x="1090" y="1170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Cada mensaje nombra la operación que lo lleva; el detalle (entradas, ejemplo, resultado esperado) está en la tabla de operaciones de sequences.md.</text>
</svg>