<rect x="40" y="1356" width="1500" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="1378" font-family="sans-serif" font-size="12.5" fill="#451a03">Cada oferta es un Appointment NUEVO (offer-number +1); los conteos de rechazo y persecución se reinician por oferta. Una cita propuesta no se reserva hasta que la paciente confirma: proposed &gt; pending</text>
<text x="54" y="1396" font-family="sans-serif" font-size="12.5" fill="#451a03">(paciente confirmó) &gt; booked (agendador reserva).</text>
<rect x="40" y="1420" width="1500" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="1442" font-family="sans-serif" font-size="12.5" fill="#451a03">Plazo de oferta: 10 días hábiles desde la aceptación. Si vence, el hub escala a la especialidad y notifica a APS. Si la especialidad no puede agendar, la derivación vuelve al re-triaje de APS (ver diagrama de</text>
<text x="54" y="1460" font-family="sans-serif" font-size="12.5" fill="#451a03">triaje, mismo Task id).</text>
<rect x="40" y="1484" width="1500" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="1506" font-family="sans-serif" font-size="12.5" fill="#451a03">Scheduling no tiene transacción de publicar o notificar: ITI-115/116/117/118 son find/hold/book/search iniciados por el cliente. La oferta, la confirmación y la persecución son el ciclo propio de la guía</text>
<text x="54" y="1524" font-family="sans-serif" font-size="12.5" fill="#451a03">(OP-3/OP-4).</text>
<text x="790" y="1574" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Cada mensaje nombra la operación que lo lleva; el detalle (entradas, ejemplo, resultado esperado) está en la tabla de operaciones de sequences.md.</text>
</svg>