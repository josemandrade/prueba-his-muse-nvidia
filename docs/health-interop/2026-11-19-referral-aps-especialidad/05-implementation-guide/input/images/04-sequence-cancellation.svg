<text x="1090" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">Paciente</text>
<rect x="1255" y="84" width="270" height="56" rx="8" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
<text x="1390" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111827">Especialista</text>
<rect x="40" y="576" width="1500" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="598" font-family="sans-serif" font-size="12.5" fill="#451a03">El diagrama muestra la cancelación solicitada por APS; la paciente o la especialidad la inician del mismo modo (misma OP-8, misma transición del Task; el solicitante queda en Provenance). El administrativo APS</text>
<text x="54" y="616" font-family="sans-serif" font-size="12.5" fill="#451a03">informa al médico APS.</text>
<rect x="40" y="640" width="1500" height="56" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="662" font-family="sans-serif" font-size="12.5" fill="#451a03">La cancelación es posible en cualquier punto antes de completarse. El fallecimiento del paciente es un motivo de cancelación (statusReason 'patient deceased'). El único camino de corrección es la re-apertura</text>
<text x="54" y="680" font-family="sans-serif" font-size="12.5" fill="#451a03">por el operador del hub.</text>
<rect x="40" y="704" width="1500" height="38" rx="8" fill="#fef9c3" stroke="#d97706" stroke-width="1"/>
<text x="54" y="726" font-family="sans-serif" font-size="12.5" fill="#451a03">360X PCC-58 Referral Cancellation es solo el patrón, con tope de dirección: PCC-58 viaja solo Initiator &gt; Recipient, mientras este caso permite que la especialidad o la paciente inicien la cancelación.</text>
<text x="790" y="776" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b7280">Cada mensaje nombra la operación que lo lleva; el detalle (entradas, ejemplo, resultado esperado) está en la tabla de operaciones de sequences.md.</text>
</svg>